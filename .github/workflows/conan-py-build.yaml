name: conan-py-build CI

on:
  push:
    branches: [conan-py-build]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_FILTER: >-
    not gdalbin
    and not test_ensure_env_decorator_sets_gdal_data_prefix
    and not test_tiled_dataset_blocksize_guard
    and not test_untiled_dataset_blocksize
    and not test_positional_calculation_byindex
    and not test_transform_geom_polygon
    and not test_reproject_error_propagation
    and not test_info_azure_unsigned
    and not test_decimated_no_use_overview
    and not test_datasetreader_ctor_url
    and not test_copyfiles_same_dataset_another_name
    and not test_python_file_reuse

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pre-commit
      - run: pre-commit run --show-diff-on-failure --all-files

  build_sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build --sdist
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheel:
    name: wheel ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.12'
          - os: macos-14
            python: '3.12'
          - os: windows-2022
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      CONAN_PY_BUILD_PROFILE_AUTODETECT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          # Key invalidates when deps change. Restore-keys fall back to a
          # warm cache on partial matches (e.g. same OS, different conanfile).
          key: conan-${{ matrix.os }}-py${{ matrix.python }}-${{ hashFiles('conanfile.py', 'pyproject.toml', 'cpp17.profile') }}
          restore-keys: |
            conan-${{ matrix.os }}-py${{ matrix.python }}-
            conan-${{ matrix.os }}-
      - name: Install patchelf (Linux RPATH patching)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y patchelf
      - name: Install Conan + detect profile
        run: |
          python -m pip install --upgrade pip conan
          conan profile detect --force
        shell: bash
      - name: Build wheel
        run: pip wheel . --no-deps -w dist-raw/ -v
        shell: bash
      - name: Dedupe + repair wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install auditwheel wheel
          # 1) Extract the raw wheel built by conan-py-build (distlib flattens
          #    Conan's symlink chains into duplicate file copies).
          mkdir -p extracted dist-deduped dist
          cd extracted && unzip -q ../dist-raw/rasterio-*.whl && cd -
          # 2) For each group of identical files in the same dir, keep the
          #    most-versioned as the canonical and turn the rest into actual
          #    symlinks. This restores the libfoo.so → libfoo.so.N → libfoo.so.N.M.K
          #    chain that the dynamic loader expects.
          python << 'PY'
          import hashlib
          from pathlib import Path
          from collections import defaultdict

          groups = defaultdict(list)
          for p in Path("extracted").rglob("*"):
              if not p.is_file() or p.is_symlink():
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              groups[(p.parent, h)].append(p)

          for (parent, _), files in groups.items():
              if len(files) < 2:
                  continue
              canonical = max(files, key=lambda f: len(f.name))
              for f in files:
                  if f != canonical:
                      f.unlink()
                      f.symlink_to(canonical.name)
          PY
          # 3) Repack with `wheel` (preserves symlinks via Unix external_attr).
          python -m wheel pack extracted/ --dest-dir dist-deduped/
          # 4) Audit + repair.
          echo "=== auditwheel show (deduped) ==="
          auditwheel show dist-deduped/rasterio-*.whl || true
          echo "=== auditwheel repair ==="
          auditwheel repair dist-deduped/rasterio-*.whl -w dist/
        shell: bash
      - name: Move unrepaired wheel (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          mkdir -p dist
          mv dist-raw/*.whl dist/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  test_wheel:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    needs: build_wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.12'
          - os: macos-14
            python: '3.12'
          - os: windows-2022
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist
      - name: Install wheel + dev deps
        run: |
          python -m pip install --upgrade pip
          # Install the locally-built wheel without resolving runtime deps,
          # then bring those (and test deps) from PyPI via requirements-dev.txt.
          python -m pip install --pre --no-deps --no-index --find-links dist rasterio
          python -m pip install -r requirements-dev.txt
        shell: bash
      - name: Smoke checks
        run: |
          rio --version
          rio --gdal-version
          rio --show-versions
        shell: bash
      - name: Clean workspace except dist and tests
        run: |
          shopt -s extglob
          rm -rf !(dist|tests)
        shell: bash
      - name: Run tests
        env:
          PROJ_NETWORK: 'ON'
        run: python -m pytest -vv tests -m "not wheel" -k "$PYTEST_FILTER"
        shell: bash
