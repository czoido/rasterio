
name: Build and publish wheels

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload wheels to PyPI? (0: no, 1: yes)'
        required: true
        default: '0'
  push:
    branches: [ main, maint-1.4, conan-py-build ]
  release:
    types: [ released, prereleased ]
  pull_request:  # also build on PRs touching this file
    branches: [ main, maint-1.4 ]
    paths:
      - ".github/workflows/build-wheels.yaml"
      - "conanfile.py"
      - "CMakeLists.txt"

# cancel running jobs on new commit to PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read

env:
  GDAL_VERSION: 3.12.1

jobs:

  build_sdist:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: |
          pip install --upgrade pip wheel build twine

      - name: Build source distribution
        run: python -m build --sdist

      - name: Verify sdist for PyPI
        run: |
           twine check dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build ${{ matrix.arch }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Smoke-test the migration on Linux x86_64 first. The upstream matrix
        # also covers aarch64, macOS arm64+x86_64, and Windows x64+ARM64 —
        # they slot back in once Linux is green; with conan-py-build the
        # per-platform setup (vcpkg / brew / yum) is no longer needed.
        include:
         - os: ubuntu-22.04
           arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          # "cibw" prefix isolates the manylinux-container cache from any
          # earlier cache built directly on the runner OS — the binaries
          # are ABI-incompatible (different glibc baseline).
          key: conan-cibw-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('conanfile.py', 'pyproject.toml') }}
          restore-keys: |
            conan-cibw-${{ matrix.os }}-${{ matrix.arch }}-
            conan-cibw-${{ matrix.os }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ENABLE: cpython-freethreading
          CIBW_SKIP: '*pp* *musllinux*'
          CIBW_ARCHS: ${{ matrix.arch }}
          # No env vars to inject (no GDAL_CONFIG, PACKAGE_DATA, etc.):
          # conan-py-build resolves the whole C/C++ graph via conanfile.py
          # + Conan profiles. cibuildwheel's default repair commands
          # (auditwheel / delocate / delvewheel) handle SONAME mangling.
          # System packages needed inside the manylinux container:
          #   - perl-core: openssl's ./Configure uses IPC::Cmd.
          #   - m4 / autoconf / automake / libtool: autotools chain that
          #     several recipes (libcurl, libiconv, ...) need via autoreconf.
          #     Use the system tools instead of letting Conan build the
          #     entire chain from sources, which is fragile inside this
          #     minimal AlmaLinux 8 image (m4 builds fail its own runtime
          #     check on some kernels). These tools only run at build time
          #     and never enter the wheel.
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y perl-core m4 autoconf automake libtool pkgconfig
          # Point autotools to the system binaries; autoreconf / aclocal /
          # autom4te honour these env vars before falling back to PATH.
          CIBW_ENVIRONMENT_LINUX: >-
            M4=/usr/bin/m4
            AUTOCONF=/usr/bin/autoconf
            AUTOMAKE=/usr/bin/automake
            LIBTOOL=/usr/bin/libtool
            AUTORECONF=/usr/bin/autoreconf
          CIBW_BEFORE_BUILD: |
            python -m pip install conan
            conan profile detect --force
          # Mount the runner's Conan cache into the manylinux container so
          # 40+ recipes don't get rebuilt from sources every run.
          CIBW_CONTAINER_ENGINE: 'docker; create_args: -v /home/runner/.conan2:/root/.conan2'
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  test_wheels:
    name: Test wheels on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: [build_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "windows-11-arm", "ubuntu-22.04-arm", "ubuntu-22.04", "macos-14", "macos-15-intel"]
        python-version: ["3.14","3.14t", "3.13", "3.12"]
        
    steps:
      - name: Checkout Rasterio
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Download wheels from artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Install dependencies and rasterio wheel
        shell: bash
        run: |
          python -m pip install numpy aiohttp attrs pytest click mock boto3 packaging hypothesis fsspec s3fs requests
          python -m pip install --pre --no-deps --no-index --find-links dist rasterio
          python -m pip install rasterio
          python -m pip list

      - name: Clean workspace except dist and tests
        shell: bash
        run: |
          shopt -s extglob
          rm -rf !(dist|tests)

      - name: Run tests
        shell: bash
        run: |
          rio --version
          rio env --formats
          PROJ_NETWORK=ON python -m pytest -vv tests -m "not gdalbin" -k "not test_ensure_env_decorator_sets_gdal_data_prefix and not test_tiled_dataset_blocksize_guard and not test_untiled_dataset_blocksize and not test_positional_calculation_byindex and not test_transform_geom_polygon and not test_reproject_error_propagation and not test_info_azure_unsigned and not test_decimated_no_use_overview and not test_datasetreader_ctor_url and not test_copyfiles_same_dataset_another_name and not test_python_file_reuse"


      - name: Check for conflicts with fiona wheel
        # Execute this step only if fiona wheel is available for the platform
        if: matrix.python-version == '3.12' && !(runner.os == 'Linux' && runner.arch == 'ARM64') && !(runner.os == 'Windows' && runner.arch == 'ARM64')
        shell: bash
        run: |
          python -m pip install fiona
          python -c "import fiona; import rasterio; print(rasterio.show_versions())"


  publish:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs: [build_wheels, build_sdist, test_wheels]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/rasterio/
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Download wheels artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish distribution 📦 to PyPI
        if: ${{ ( github.event_name == 'release' && github.ref_type == 'tag' ) || github.event.inputs.upload == '1'}}
        uses: pypa/gh-action-pypi-publish@release/v1
